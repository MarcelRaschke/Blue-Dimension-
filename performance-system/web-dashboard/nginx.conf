server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1000;

    # SPA routing
    location / {
        try_files $uri /index.html;
    }

    # API proxy (plain HTTP, no Upgrade forwarding)
    location /api/ {
        # Public reverse proxy: 'internal' would block client access, upstream is fixed by API_HOST
        proxy_pass http://${API_HOST:=localhost:5000}/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # WebSocket proxy: Upgrade is required here, the upstream is fixed by API_HOST
    location /ws {
        # Public reverse proxy: 'internal' would block client access, upstream is fixed by API_HOST
        proxy_pass http://${API_HOST:=localhost:5000};
        proxy_http_version 1.1;
        # Upgrade is forwarded only for WebSocket clients; upstream is fixed by API_HOST
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
