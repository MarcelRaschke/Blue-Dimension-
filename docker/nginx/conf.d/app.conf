server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/app_access.log main;
    error_log /var/log/nginx/app_error.log warn;

    # Hide nginx version
    server_tokens off;

    # Disable direct access to hidden files and editor backups
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # No PHP runtime: never hand a .php file to anything, always 404
    location ~ \.php$ {
        return 404;
    }

    # Static assets
    # No add_header here: a location-level add_header would replace the
    # security headers set at server level. expires sets Cache-Control max-age.
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf|eot|map)$ {
        expires 30d;
        access_log off;
    }

    # Pages: /news resolves to news.html, / to index.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
