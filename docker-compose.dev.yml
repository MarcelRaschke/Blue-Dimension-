version: '3.8'

services:
  # PHP-FPM Application Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: blue-dimension-app-dev
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=jessejay
      - DB_USERNAME=app
      - DB_PASSWORD=${DB_PASSWORD:-app_password}
      - REDIS_HOST=cache
      - REDIS_PORT=6379
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
      - ./docker/php/php-fpm.conf:/usr/local/etc/php-fpm.conf:ro
      - php_logs:/var/log/php
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - blue-dimension-dev
    healthcheck:
      test: ["CMD", "php-fpm", "-v"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx Web Server
  web:
    image: nginx:latest
    container_name: blue-dimension-web-dev
    restart: unless-stopped
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "8000:80"
      - "8443:443"
    depends_on:
      - app
    networks:
      - blue-dimension-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: blue-dimension-db-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: jessejay
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
      - mysql_logs:/var/log/mysql
    ports:
      - "3306:3306"
    networks:
      - blue-dimension-dev
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command:
      - --max_connections=100
      - --default-storage-engine=InnoDB
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  # Redis Cache (Optional)
  cache:
    image: redis:7-alpine
    container_name: blue-dimension-cache-dev
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - blue-dimension-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    command: redis-server --appendonly yes

networks:
  blue-dimension-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  php_logs:
    driver: local
  nginx_logs:
    driver: local
  mysql_data:
    driver: local
  mysql_logs:
    driver: local
  redis_data:
    driver: local
