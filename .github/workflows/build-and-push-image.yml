name: Build and Push Docker Image to GHCR

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/build-and-push-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create image manifest
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          ACTOR_NAME: ${{ github.actor }}
        run: |
          cat > /tmp/image-manifest.txt << EOF
          Docker Image Pushed to GHCR
          ============================
          Registry: ${REGISTRY}
          Image: ${IMAGE_NAME}
          Tags: ${IMAGE_TAGS}
          Commit: ${COMMIT_SHA}
          Branch: ${BRANCH_NAME}
          Actor: ${ACTOR_NAME}
          Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          cat /tmp/image-manifest.txt

      - name: Send Slack notification - success
        if: success()
        uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3 # v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "📦 Docker image pushed to GHCR",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "📦 *Docker Image Published*\n*Registry*: GHCR (ghcr.io)\n*Image*: ${{ env.IMAGE_NAME }}\n*Commit*: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Tags*: latest, ${{ github.ref_name }}-${{ github.sha }}\n*Status*: Successfully pushed"
                  }
                }
              ]
            }
        continue-on-error: true

      - name: Send Slack notification - failure
        if: failure()
        uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3 # v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ Docker image build failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Docker Image Build Failed*\n*Registry*: GHCR (ghcr.io)\n*Image*: ${{ env.IMAGE_NAME }}\n*Commit*: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Branch*: ${{ github.ref_name }}\n*Status*: Build or push failed"
                  }
                }
              ]
            }
        continue-on-error: true
