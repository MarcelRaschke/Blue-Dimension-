name: Build and Push Docker Image to GHCR

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/build-and-push-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create image manifest
        run: |
          cat > /tmp/image-manifest.txt << 'EOF'
          Docker Image Pushed to GHCR
          ============================
          Registry: ${{ env.REGISTRY }}
          Image: ${{ env.IMAGE_NAME }}
          Tags: ${{ steps.meta.outputs.tags }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Actor: ${{ github.actor }}
          Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          cat /tmp/image-manifest.txt

      - name: Send Slack notification - success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "📦 Docker image pushed to GHCR",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "📦 *Docker Image Published*\n*Registry*: GHCR (ghcr.io)\n*Image*: ${{ env.IMAGE_NAME }}\n*Commit*: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Tags*: latest, ${{ github.ref_name }}-${{ github.sha }}\n*Status*: Successfully pushed"
                  }
                }
              ]
            }
        continue-on-error: true

      - name: Send Slack notification - failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ Docker image build failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Docker Image Build Failed*\n*Registry*: GHCR (ghcr.io)\n*Image*: ${{ env.IMAGE_NAME }}\n*Commit*: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Branch*: ${{ github.ref_name }}\n*Status*: Build or push failed"
                  }
                }
              ]
            }
        continue-on-error: true
