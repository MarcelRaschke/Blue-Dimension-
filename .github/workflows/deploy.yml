name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://djjessejay.ch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, ctype, fileinfo

      - name: Validate PHP syntax
        run: |
          find . -name "*.php" -type f \
            ! -path "./vendor/*" \
            ! -path "./.git/*" \
            -exec php -l {} \;

      - name: Create deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              required_contexts: [],
              auto_merge: false,
              description: 'Deployment to djjessejay.ch'
            });
            core.setOutput('deployment_id', deployment.data.id);

      - name: Update deployment status - in_progress
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'in_progress',
              description: 'Deployment in progress'
            });

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Build/Prepare assets
        run: |
          echo "Preparing deployment..."
          echo "PHP files:"
          find . -type f -name "*.php" \
            ! -path "./.git/*" \
            ! -path "./.github/*" | wc -l
          echo "Config files:"
          find . -type f -name "*.xml" \
            ! -path "./.git/*" \
            ! -path "./.github/*" | wc -l

      - name: Deploy via SFTP
        id: deploy
        run: |
          DEPLOY_USER="${{ secrets.DEPLOY_USER }}"
          DEPLOY_HOST="${{ secrets.DEPLOY_HOST }}"
          DEPLOY_PATH="/var/www/djjessejay.ch"

          # Create SFTP batch file for deployment
          cat > /tmp/sftp_deploy.txt << 'EOF'
          cd $DEPLOY_PATH
          put -r public/*
          put -r scripts/*
          put .env.example
          put *.md
          put *.sql
          quit
          EOF

          # Execute SFTP upload
          echo "Uploading files to $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"
          sftp -i ~/.ssh/deploy_key -b /tmp/sftp_deploy.txt "$DEPLOY_USER@$DEPLOY_HOST" || {
            echo "SFTP upload failed"
            exit 1
          }

          echo "deployment_status=success" >> $GITHUB_OUTPUT
          rm -f /tmp/sftp_deploy.txt ~/.ssh/deploy_key

      - name: Wait for deployment
        run: sleep 10

      - name: Verify deployment health
        id: verify
        run: |
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh https://djjessejay.ch || {
            echo "health_check_status=failed" >> $GITHUB_OUTPUT
            exit 1
          }
          echo "health_check_status=success" >> $GITHUB_OUTPUT

      - name: Update deployment status - success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'success',
              description: 'Deployment succeeded and verified healthy',
              environment_url: 'https://djjessejay.ch'
            });

      - name: Update deployment status - failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'failure',
              description: 'Deployment or health check failed'
            });
