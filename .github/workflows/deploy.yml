name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://djjessejay.ch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, ctype, fileinfo

      - name: Validate PHP syntax
        run: |
          find . -name "*.php" -type f \
            ! -path "./vendor/*" \
            ! -path "./.git/*" \
            -exec php -l {} \;

      - name: Create deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              required_contexts: [],
              auto_merge: false,
              description: 'Deployment to djjessejay.ch'
            });
            core.setOutput('deployment_id', deployment.data.id);

      - name: Update deployment status - in_progress
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'in_progress',
              description: 'Starting deployment to production'
            });

      - name: Build/Prepare assets
        run: |
          echo "Preparing deployment..."
          find . -type f \( -name "*.php" -o -name "*.xml" -o -name "*.mov" \) \
            ! -path "./.git/*" \
            ! -path "./.github/*" | wc -l

      - name: Deploy via SFTP
        id: deploy
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PATH: /home/${{ secrets.DEPLOY_USER }}/public_html/
          ARGS: "-avz --delete"
          EXCLUDE: |
            .git/
            .github/
            node_modules/
            vendor/
            .env
            .env.local
            *.swp
            *.swo
            *~
            .DS_Store
            npm-debug.log
            package-lock.json

      - name: Verify deployment health
        run: |
          chmod +x ./scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh "https://djjessejay.ch"

      - name: Update deployment status - success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'success',
              description: 'Deployment succeeded - health check passed',
              environment_url: 'https://djjessejay.ch'
            });

      - name: Update deployment status - failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'failure',
              description: 'Deployment failed - health check or SFTP upload failed'
            });
