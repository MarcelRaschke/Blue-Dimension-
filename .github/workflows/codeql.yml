# CodeQL Advanced Setup (einzige CodeQL-Analyse im Repo)
# Ergebnisse: Security > Code scanning
# PHP (app/, templates/, scripts/*.php) unterstützt CodeQL nicht; dafür laufen
# php-lint.yml und Semgrep in security.yml.
name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "content/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "content/**"
  schedule:
    - cron: "38 20 * * 2"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # .github/workflows/*.yml
          - language: actions
            build-mode: none
          # performance-system/osc-bridge: deaktiviert, bis go.mod/go.sum
          # repariert sind (Pseudo-Version von hypebeast/go-osc existiert
          # nicht, go build schlägt fehl). Danach einkommentieren.
          # - language: go
          #   build-mode: manual
          # performance-system/{api-server,stream-engine,web-dashboard}, public/
          - language: javascript-typescript
            build-mode: none
          # scripts/build-images.py
          - language: python
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: performance-system/osc-bridge/go.mod
          cache-dependency-path: performance-system/osc-bridge/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build osc-bridge (Go)
        if: matrix.language == 'go'
        working-directory: performance-system/osc-bridge
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
